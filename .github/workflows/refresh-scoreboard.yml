name: Refresh 1836 scoreboard

on:
  schedule:
    # About every 5 minutes. Scheduled workflows run from the default branch,
    # and GitHub may start them later than the cron time during busy periods.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scoreboard-sales-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out scheduler scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh live sales
        env:
          SCOREBOARD_REFRESH_TOKEN: ${{ secrets.SCOREBOARD_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/refresh_call.py \
            --profile sales \
            --path /api/refresh-sales \
            --token-env SCOREBOARD_REFRESH_TOKEN \
            --allow-remote \
            --timeout-seconds 60 \
            --max-attempts 3 \
            --backoff-seconds 10,30
