name: Refresh 1836 KPI snapshot

on:
  schedule:
    # Monday-only KPI refresh, America/Chicago. GitHub cron is UTC and does not
    # follow US daylight-saving time, so each local time is registered twice:
    # Central Daylight Time (UTC-5) and Central Standard Time (UTC-6).
    # refresh_call.py keeps the run only when this cron's Chicago clock time is
    # one of Mon-00:15, Mon-04:15, Mon-05:00 and the job starts within ±40
    # minutes. The other registration exits 0 without calling the app.
    # 12:15 a.m. Chicago is still Monday in UTC under both offsets.
    #
    # 12:15 a.m. Monday — La Viva can be final after midnight.
    #   CDT 05:15 UTC Monday, CST 06:15 UTC Monday.
    - cron: "15 5 * * 1"
    - cron: "15 6 * * 1"
    # 4:15 a.m. Monday — two Zalat stores close around 3 a.m., so Zalat sales
    # and labor are final only after 4 a.m.
    #   CDT 09:15 UTC Monday, CST 10:15 UTC Monday.
    - cron: "15 9 * * 1"
    - cron: "15 10 * * 1"
    # 5:00 a.m. Monday — final refresh. Everything must be up by 5 a.m.
    #   CDT 10:00 UTC Monday, CST 11:00 UTC Monday.
    - cron: "0 10 * * 1"
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      kpi_path:
        description: "Path to POST. Leave empty to use KPI_REFRESH_PATH. The app contract path is /api/refresh-kpis."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: scoreboard-kpi-refresh
  cancel-in-progress: false

jobs:
  refresh-kpis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out scheduler scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh KPI snapshot
        env:
          SCOREBOARD_KPI_REFRESH_TOKEN: ${{ secrets.SCOREBOARD_KPI_REFRESH_TOKEN }}
          SCOREBOARD_REFRESH_TOKEN: ${{ secrets.SCOREBOARD_REFRESH_TOKEN }}
          KPI_PATH_INPUT: ${{ github.event.inputs.kpi_path }}
          KPI_PATH_VAR: ${{ vars.KPI_REFRESH_PATH }}
          KPI_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python3 scripts/refresh_call.py \
            --profile kpi \
            --path "${KPI_PATH_INPUT:-}" \
            --path-fallback "${KPI_PATH_VAR:-}" \
            --token-env SCOREBOARD_KPI_REFRESH_TOKEN \
            --token-env-fallback SCOREBOARD_REFRESH_TOKEN \
            --allow-remote \
            --timeout-seconds 120 \
            --max-attempts 3 \
            --backoff-seconds 10,30 \
            --event "${GITHUB_EVENT_NAME}" \
            --require-chicago-slots Mon-00:15,Mon-04:15,Mon-05:00 \
            --chicago-slot-tolerance-minutes 40 \
            --schedule "${KPI_SCHEDULE:-}"
