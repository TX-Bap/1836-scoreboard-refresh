name: Refresh 1836 KPI snapshot

on:
  schedule:
    # Monday KPI snapshot, finished before 7:00 a.m. America/Chicago.
    # GitHub cron is UTC and does not follow daylight-saving time. Scheduled
    # runs are often delayed and are sometimes dropped, so several Monday UTC
    # times are registered. Each one is Monday morning in both CST (UTC-6) and
    # CDT (UTC-5). At least one falls between about 4:30 and 6:30 a.m. Chicago
    # in either season. :15 and :45 avoid the top of the hour, when GitHub
    # delays scheduled workflows. The script sends the request whenever the
    # job actually starts on a Chicago Monday, including a late start. A
    # scheduled start on another weekday exits non-zero and does not call the app.
    #
    # 10:15 UTC Monday — 4:15 a.m. CST / 5:15 a.m. CDT
    - cron: "15 10 * * 1"
    # 10:45 UTC Monday — 4:45 a.m. CST / 5:45 a.m. CDT
    - cron: "45 10 * * 1"
    # 11:15 UTC Monday — 5:15 a.m. CST / 6:15 a.m. CDT
    - cron: "15 11 * * 1"
    # 11:45 UTC Monday — 5:45 a.m. CST / 6:45 a.m. CDT
    - cron: "45 11 * * 1"
    # 12:15 UTC Monday — 6:15 a.m. CST / 7:15 a.m. CDT
    # Last-resort backup if the four earlier Monday crons are all dropped.
    # During CDT this starts after 7:00 a.m. The sales workflow dispatch
    # (Monday 10:20-12:30 UTC) is the backup that can still finish before
    # 7:00 a.m. in both seasons.
    - cron: "15 12 * * 1"
  workflow_dispatch:
    inputs:
      kpi_path:
        description: "Path to POST. Leave empty to use KPI_REFRESH_PATH. The app contract path is /api/refresh-kpis."
        required: false
        default: ""
        type: string
      range_start:
        description: "Optional first business date to re-pull (YYYY-MM-DD). Leave empty to use KPI_RANGE_MODE."
        required: false
        default: ""
        type: string
      range_end:
        description: "Optional last business date to re-pull (YYYY-MM-DD). Empty means today in America/Chicago."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: scoreboard-kpi-refresh
  cancel-in-progress: false

jobs:
  refresh-kpis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out scheduler scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh KPI snapshot
        env:
          SCOREBOARD_KPI_REFRESH_TOKEN: ${{ secrets.SCOREBOARD_KPI_REFRESH_TOKEN }}
          SCOREBOARD_REFRESH_TOKEN: ${{ secrets.SCOREBOARD_REFRESH_TOKEN }}
          KPI_PATH_INPUT: ${{ github.event.inputs.kpi_path }}
          KPI_PATH_VAR: ${{ vars.KPI_REFRESH_PATH }}
          # Repository variable. Leave unset (or "none") until the app accepts
          # ?start=&end= on /api/refresh-kpis; then set it to prior-and-current so
          # every Monday run re-pulls the full prior Mon-Sun week plus this week.
          KPI_RANGE_VAR: ${{ vars.KPI_RANGE_MODE }}
          RANGE_START_INPUT: ${{ github.event.inputs.range_start }}
          RANGE_END_INPUT: ${{ github.event.inputs.range_end }}
        run: |
          set -euo pipefail
          python3 scripts/refresh_call.py \
            --profile kpi \
            --path "${KPI_PATH_INPUT:-}" \
            --path-fallback "${KPI_PATH_VAR:-}" \
            --token-env SCOREBOARD_KPI_REFRESH_TOKEN \
            --token-env-fallback SCOREBOARD_REFRESH_TOKEN \
            --allow-remote \
            --timeout-seconds 120 \
            --max-attempts 3 \
            --backoff-seconds 10,30 \
            --event "${GITHUB_EVENT_NAME}" \
            --require-chicago-monday \
            --kpi-range "${KPI_RANGE_VAR:-none}" \
            --range-start "${RANGE_START_INPUT:-}" \
            --range-end "${RANGE_END_INPUT:-}"
